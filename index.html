<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube Food Live Overlay</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:transparent;
    font-family:Arial,sans-serif;
}

#effectBox{
    width:100%;
    height:100%;
    position:absolute;
    pointer-events:none;
}

.effect{
    position:absolute;
    font-size:90px;
    animation:fly 3s ease-out forwards;
}

.text{
    position:absolute;
    top:45%;
    width:100%;
    text-align:center;
    font-size:55px;
    font-weight:bold;
    color:white;
    text-shadow:
    0 0 10px black,
    0 0 25px orange;
    animation:textShow 3s forwards;
}


@keyframes fly{

0%{
transform:translateY(100vh) scale(.3);
opacity:0;
}

30%{
opacity:1;
}

100%{
transform:
translateY(-100px)
rotate(360deg)
scale(1.5);
opacity:0;
}

}


@keyframes textShow{

0%{
transform:scale(0);
opacity:0;
}

30%{
transform:scale(1.2);
opacity:1;
}

100%{
opacity:0;
}

}

</style>

</head>


<body tabindex="0">


<div id="effectBox"></div>


<script>


const effects={

fire:{
emoji:"🔥",
text:"FIRE COOKING 🔥"
},

love:{
emoji:"❤️",
text:"LOVE FOOD ❤️"
},

cheese:{
emoji:"🧀",
text:"CHEESE TIME!"
},

egg:{
emoji:"🥚",
text:"EGG POWER!"
},

noodle:{
emoji:"🍜",
text:"NOODLE MASTER!"
},

bbq:{
emoji:"🍖",
text:"BBQ FIRE!"
},

dragon:{
emoji:"🐉",
text:"DRAGON ATTACK!"
},

panda:{
emoji:"🐼",
text:"PANDA LOVE!"
}

};



function playEffect(key){

let data=effects[key];

if(!data)return;


let box=document.getElementById("effectBox");


// emoji数量

for(let i=0;i<10;i++){

let e=document.createElement("div");

e.className="effect";

e.innerHTML=data.emoji;

e.style.left=Math.random()*90+"%";

e.style.animationDelay=
Math.random()*0.5+"s";


box.appendChild(e);


setTimeout(()=>{
e.remove();
},3000);

}



//文字

let t=document.createElement("div");

t.className="text";

t.innerHTML=data.text;


box.appendChild(t);


setTimeout(()=>{
t.remove();
},3000);


}




// ====================
// 快捷键设置
// ====================


const keys={


// F键
"F1":"fire",
"F2":"love",
"F3":"cheese",
"F4":"egg",
"F5":"noodle",
"F6":"bbq",
"F7":"dragon",
"F8":"panda",


// 数字键

"1":"fire",
"2":"love",
"3":"cheese",
"4":"egg",
"5":"noodle",
"6":"bbq",
"7":"dragon",
"8":"panda"

};




// 自动获取焦点

window.onload=function(){

document.body.focus();

window.focus();

}



// 点击重新获取焦点

document.body.onclick=function(){

document.body.focus();

}



// 键盘监听

document.addEventListener("keydown",function(e){

let key = e.key.toUpperCase();


// 兼容数字键盘
if(e.code.startsWith("Digit")){
    key = e.code.replace("Digit","");
}

if(e.code.startsWith("Numpad")){
    key = e.code.replace("Numpad","");
}


// 防止浏览器快捷键
e.preventDefault();


if(keys[key]){

    playEffect(keys[key]);

}

});


</script>


</body>
</html>
