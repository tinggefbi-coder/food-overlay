<script>

const effects={

welcome:{
emoji:"👋",
text:"欢迎来到直播间"
},

fire:{
emoji:"🔥",
text:"FIRE COOKING 🔥"
},

love:{
emoji:"❤️",
text:"LOVE FOOD ❤️"
}

};



function playEffect(key,username=""){

let data=effects[key];

if(!data)return;


let box=document.getElementById("effectBox");


// emoji掉落

for(let i=0;i<10;i++){

let e=document.createElement("div");

e.className="effect";

e.innerHTML=data.emoji;

e.style.left=Math.random()*90+"%";

e.style.animationDelay=
Math.random()*0.5+"s";

box.appendChild(e);


setTimeout(()=>{
e.remove();
},3000);

}



// 文字

let t=document.createElement("div");

t.className="text";


if(username){

t.innerHTML=
data.text+
"<br><span style='font-size:35px'>Welcome "+username+"!</span>";

}else{

t.innerHTML=data.text;

}


box.appendChild(t);


setTimeout(()=>{
t.remove();
},3000);


}



// ==========================
// Upstream 弹幕连接
// ==========================


// 把这里换成你的 Upstream 地址

let socket = new WebSocket(
"ws://localhost:1234"
);



socket.onopen=function(){

console.log("Chat Connected");

};




socket.onmessage=function(event){


console.log(event.data);


// 接收弹幕

let data;


try{

data=JSON.parse(event.data);

}

catch(e){

return;

}



let msg=
(data.message ||
 data.text ||
 data.content ||
 "")
.toLowerCase();



let username=
data.username ||
data.author ||
data.name ||
"Guest";



// 欢迎关键词

if(

msg.includes("hello") ||
msg.includes("hi") ||
msg.includes("你好") ||
msg.includes("哈喽")

){

playEffect(
"welcome",
username
);

}



};




socket.onerror=function(){

console.log("Chat Error");

};


</script>
